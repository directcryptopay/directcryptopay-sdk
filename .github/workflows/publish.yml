name: Publish to npm (Trusted Publishing)

# Secure, reproducible publish for @directcryptopay/sdk using npm Trusted
# Publishing (OIDC). No NPM_TOKEN is used. Publishing is NEVER automatic on a
# plain push to main: it runs only on a published GitHub Release, or via a
# manual workflow_dispatch that requires typing the exact version to confirm.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'Exact version to publish (must equal package.json "version"), e.g. 0.3.2'
        required: true

permissions:
  contents: read      # checkout only
  id-token: write     # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish   # optional protection gate (see report)
    steps:
      - name: Checkout (pinned to the triggering ref)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies (reproducible)
        run: npm ci || npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify tarball is clean and reproducible
        run: npm run verify:pack

      - name: Validate version matches trigger
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "package.json version: $PKG_VERSION"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirm_version }}" != "$PKG_VERSION" ]; then
              echo "::error::confirm_version '${{ github.event.inputs.confirm_version }}' != package.json '$PKG_VERSION'"
              exit 1
            fi
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "$TAG" != "v$PKG_VERSION" ] && [ "$TAG" != "$PKG_VERSION" ]; then
              echo "::error::release tag '$TAG' does not match package.json '$PKG_VERSION'"
              exit 1
            fi
          fi

      - name: Publish (public, Trusted Publishing / OIDC, with provenance)
        run: npm publish --access public --provenance
